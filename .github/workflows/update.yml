name: Update casks

# Daily, or by hand: pick up a new Animetro release, verify it and update the cask.
# Release data is untrusted input: it's validated before use and only reaches the shell as quoted env variables.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write # commit the updated cask

concurrency:
  group: update-casks
  cancel-in-progress: false

jobs:
  animetro:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check for a newer release
        id: check
        run: |
          tag=$(gh release view -R lonlydwolf/animetro --json tagName --jq .tagName)
          latest=${tag#v}
          if ! [[ "$latest" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The latest release tag is not a plain version (vX.Y.Z); not updating."
            exit 1
          fi
          current=$(sed -n 's/^  version "\(.*\)"$/\1/p' Casks/animetro.rb)
          echo "current $current, latest $latest"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [ "$latest" != "$current" ]; then echo "update=true" >> "$GITHUB_OUTPUT"; fi
      - name: Download and verify the release
        if: steps.check.outputs.update == 'true'
        id: sha
        env:
          VERSION: ${{ steps.check.outputs.latest }}
        run: |
          base="https://github.com/lonlydwolf/animetro/releases/download/v$VERSION"
          curl -sSfL -o app.zip "$base/Animetro-$VERSION-macOS.zip"
          sha=$(curl -sSfL "$base/Animetro-$VERSION-macOS.zip.sha256" | cut -d' ' -f1)
          if ! [[ "$sha" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::The release's .sha256 file doesn't hold a SHA-256."
            exit 1
          fi
          echo "$sha  app.zip" | shasum -a 256 -c -
          rm app.zip
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      # Commits pushed with the workflow token don't start other workflows, so this job runs tests.yml's checks itself.
      - name: Update the cask, audit it and test an install
        if: steps.check.outputs.update == 'true'
        env:
          VERSION: ${{ steps.check.outputs.latest }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          sed -i '' -e "s/^  version \".*\"$/  version \"$VERSION\"/" -e "s/^  sha256 \".*\"$/  sha256 \"$SHA\"/" Casks/animetro.rb
          git -c user.name=x -c user.email=x@x commit -qam tmp
          brew tap lonlydwolf/tap "$GITHUB_WORKSPACE"
          brew trust --cask lonlydwolf/tap/animetro
          brew style lonlydwolf/tap
          brew audit --cask --strict --online lonlydwolf/tap/animetro
          brew install --cask lonlydwolf/tap/animetro
          test -x /Applications/Animetro.app/Contents/MacOS/Animetro
          brew uninstall --cask --zap animetro
          test ! -e /Applications/Animetro.app
          git reset -q --soft HEAD~1
      - name: Commit
        if: steps.check.outputs.update == 'true'
        env:
          VERSION: ${{ steps.check.outputs.latest }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "chore: update animetro to $VERSION" -m "Version and SHA-256 from the v$VERSION GitHub release, verified against the downloaded zip, audited with brew audit --strict --online and test-installed."
          git push
